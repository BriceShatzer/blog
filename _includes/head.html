<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    {%- if page.noindex %}
    <meta name="robots" content="noindex, follow">
    {%- endif %}

    {% seo %}
    {% feed_meta %}

    <link rel="icon" type="image/png" sizes="128x128" href="{{ '/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Droid+Sans:700,400%7CLato:700,400&amp;display=swap">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    {%- if jekyll.environment == "production" and site.google_analytics %}
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {%- endif %}
</head>
