# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: BriceShatzer.com/blog
# Required once jekyll-seo-tag is on: when a page's title equals the site title
# (exactly index.html), seo-tag falls back to `site.tagline || site.description`.
# Without a tagline the homepage <title> becomes the whole description paragraph.
tagline: "Notes on front-end engineering, tooling, and the occasional detour."
email: brice.shatzer@gmail.com
description: >
  The professional blog of Brice Shatzer, a Chicago-based Iowan that, until recently, was working
  on the software that powers some of the internet's favorite sites. Opinions here are my own.
lang: en-US

# Scheme + host only, no trailing slash. Was "http://BriceShatzer.com"; the scheme fix
# removes a redirect hop from every generated redirect page and from feed.xml.
url: "https://briceshatzer.com"

# This repo is a project page served from briceshatzer.com/blog/. The CNAME lives in
# BriceShatzer/BriceShatzer.github.io -- do NOT add a CNAME file here.
baseurl: "/blog"

twitter_username: _shatzer
github_username: BriceShatzer

author:
  name: Brice Shatzer
  email: brice.shatzer@gmail.com
  uri: https://briceshatzer.com     # jekyll-feed reads .uri
  url: https://briceshatzer.com     # jekyll-seo-tag reads .url (JSON-LD author.url)
  twitter: _shatzer

# Drives JSON-LD `sameAs`, which seo-tag emits only on the homepage.
social:
  name: Brice Shatzer
  links:
    - https://briceshatzer.com
    - https://github.com/BriceShatzer
    - https://www.linkedin.com/in/briceshatzer
    - https://twitter.com/_shatzer
    - https://stackoverflow.com/users/1608016/brice-shatzer
    - https://codepen.io/BriceShatzer

twitter:
  username: _shatzer
  # Deliberately `summary`, not `summary_large_image`: face.png is 468x468 square
  # and a large card would letterbox it badly.
  card: summary

# Publisher logo for the JSON-LD Organization.
logo: /assets/face.png

# GA4 Measurement ID (Admin -> Data streams -> web stream). Not the property ID.
# Only emitted when JEKYLL_ENV=production, so local builds don't pollute the data.
google_analytics: G-LMML5T119W

# Every post's `date:` carries an explicit -0500 offset, but site.time and the
# feed/sitemap timestamps follow the builder's TZ. Pinning it makes a local build
# byte-identical to a CI build (GitHub runners are UTC).
timezone: America/Chicago

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge

# Replicates what the `github-pages` gem injected server-side.
# `default_lang: plaintext` is load-bearing: it is why un-languaged fenced code blocks
# render as class="language-plaintext highlighter-rouge".
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext

# The legacy builder forced `style: compressed` in production only, which is why local
# builds never matched the live site. Pinning it here makes them match.
# jekyll-sass-converter 3.x is Dart Sass: only `expanded` and `compressed` exist.
sass:
  style: compressed
  sourcemap: never          # 3.x defaults to :always and would emit style.css.map
  quiet_deps: true
  silence_deprecations:
    - import                # vendored Cayman Sass still uses @import
    - global-builtin        # ...and the global invert()
    - color-functions

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Fallback only. Every post pins its own `permalink:`, so this governs nothing that
# currently exists -- it just keeps `jekyll build` sane if a post is added without one.
permalink: /:year-:month-:day-:title

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  # A site-wide OG image MUST come through defaults: seo-tag's ImageDrop reads
  # page["image"] only -- a top-level `image:` key does nothing. The hash form is
  # also what unlocks og:image:width/height/alt.
  - scope:
      path: ""
    values:
      image:
        path: /assets/face.png
        width: 468
        height: 468
        alt: "Brice Shatzer"

  # Keeps the orphaned PDFs under assets/post-files/ out of the sitemap
  # (jekyll-sitemap includes .pdf).
  - scope:
      path: "assets"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-version
  # The developer README. It has no front matter, so under the legacy builder
  # jekyll-optional-front-matter published it at /blog/Project-README.html.
  # Excluding it means it can never be published again.
  - README.md
