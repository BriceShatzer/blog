---
layout: default
---
<article class="post">
  <time class="meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time>{%- if page.last_modified_at %}<span class="meta"> &middot; updated <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: '%B %d, %Y' }}</time></span>{%- endif %}

  <h1 class="post-title">{{ page.title }}</h1>

  {{ content }}
</article>
